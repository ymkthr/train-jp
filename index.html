<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Train JP</title>
    <style>
      html, body {
        margin: 0;
        background: #111111;
        color: #FFFFFF;
        font: 16px/1.5 system-ui, "Source Han Sans", sans-serif;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      main { padding: 20px; display: grid; gap: 16px; }
      input, button {
        font: inherit; padding: 12px 16px; border: 0; border-radius: 12px;
        background: rgba(255,255,255,0.08); color: inherit;
      }
      button { background: #FEF991; color: #232323; font-weight: 600; }
      #status, #voice, footer { color: #8A8A8A; font-size: 13px; }
      #heard { font-size: 20px; white-space: pre-line; }
      #heard:empty { display: none; }
      footer a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <form id="search" style="display: grid; gap: 12px">
        <input name="from" placeholder="出発駅（例: 東京）" required />
        <input name="to" placeholder="到着駅（例: 箱根湯本）" required />
        <button>検索</button>
      </form>
      <p id="voice"></p>
      <p id="heard"></p>
      <p id="status"></p>
      <footer>
        経路: <a href="https://transitous.org/sources/">Transitous</a>
        (© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors) /
        路線名: <a href="http://express.heartrails.com/">HeartRails Express</a><br />
        連絡先: <a href="https://github.com/ymkthr/train-jp">github.com/ymkthr/train-jp</a>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
